    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Wesley Mendes",
        "url": "https://wesleymendes.vercel.app/",
        "jobTitle": "Tech Lead",

        "sameAs": ["https://github.com/Wesleyhmendes", "https://www.linkedin.com/in/wesley-mendes/"]
      }
    </script>

    <script>
      // Aplica tema e idioma antes da primeira pintura, para evitar o flash de
      // tema claro em quem escolheu o escuro.
      (function () {
        try {
          var theme = localStorage.getItem('portfolio:theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          var lang = localStorage.getItem('portfolio:lang');
          document.documentElement.lang =
            lang === 'pt' || (lang === null && navigator.language.toLowerCase().startsWith('pt'))
              ? 'pt'
              : 'en';
        } catch (error) {
          void error;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
